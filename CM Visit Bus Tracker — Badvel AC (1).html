html{scroll-padding-top:env(safe-area-inset-top,0px);}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}

.stat .n{font-size:20px;font-weight:700;}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.village{font-weight:600;font-size:14.5px;}
.mandal{color:var(--sub);font-size:12px;}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap;}
.pill.pending{background:var(--pending-bg);color:var(--pending);}
.pill.started{background:var(--started-bg);color:var(--started);}
.pill.reached{background:var(--reached-bg);color:var(--reached);}
.pill.returned{background:var(--returned-bg);color:var(--returned);}
.meta{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;}
.meta b{color:var(--text);font-weight:500;}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
button.act{border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:#fff;}
button.act:disabled{opacity:.35;cursor:default;}
.b-start{background:var(--started);} .b-reach{background:var(--reached);} .b-return{background:var(--returned);} .b-reset{background:var(--pending);}
.ts{font-size:10.5px;color:var(--sub);}
.empty{text-align:center;color:var(--sub);padding:30px;}
.savebar{position:fixed;bottom:0;left:0;right:0;background:var(--accent);color:#fff;text-align:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;transform:translateY(100%);transition:transform .3s;}
.savebar.show{transform:translateY(0);}
</style>

<script>
let DATA = JSON.parse(document.getElementById('bus-data').textContent);
let artifactApi = null;
const STATUS_LABEL = {pending:'Not Started', started:'Started', reached:'Reached', returned:'Returned'};
const NEXT = {pending:'started', started:'reached', reached:'returned'};
const NEXT_LABEL = {pending:'Mark Started', started:'Mark Reached', reached:'Mark Returned'};

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

function populateMandalFilter(){
  const sel = document.getElementById('mandalFilter');
  if(sel.options.length > 1) return;
  const mandals = [...new Set(DATA.map(d=>d.mandal))].sort();
  mandals.forEach(m=>{
    const o = document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o);
  });
}

function renderSummary(){
  const counts = {pending:0, started:0, reached:0, returned:0};
  DATA.forEach(d=>counts[d.status]++);
  const el = document.getElementById('summary');
  el.innerHTML = `
    <div class="stat"><div class="n" style="color:var(--pending)">${counts.pending}</div><div class="l">Not Started</div></div>
    <div class="stat"><div class="n" style="color:var(--started)">${counts.started}</div><div class="l">Started</div></div>
    <div class="stat"><div class="n" style="color:var(--reached)">${counts.reached}</div><div class="l">Reached</div></div>
    <div class="stat"><div class="n" style="color:var(--returned)">${counts.returned}</div><div class="l">Returned</div></div>`;
}

function renderList(){
  const mandal = document.getElementById('mandalFilter').value;
  const status = document.getElementById('statusFilter').value;
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const filtered = DATA.filter(d=>{
    if(mandal && d.mandal !== mandal) return false;
    if(status && d.status !== status) return false;
    if(q){
      const hay = (d.village+' '+d.start+' '+d.driver+' '+d.busNo+' '+d.busInch+' '+d.inch).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(filtered.length === 0){ list.innerHTML = '<div class="empty">No buses match this filter.</div>'; return; }
  list.innerHTML = filtered.map(d=>{
    const ts = d.ts || {};
    let tsLine = '';
    if(ts.started) tsLine += `Started: ${fmtTime(ts.started)}  `;
    if(ts.reached) tsLine += `· Reached: ${fmtTime(ts.reached)}  `;
    if(ts.returned) tsLine += `· Returned: ${fmtTime(ts.returned)}`;
    let actions = '';
    if(d.status !== 'returned'){
      actions += `<button class="act ${d.status==='pending'?'b-start':d.status==='started'?'b-reach':'b-return'}" onclick="advance(${d.id})">${NEXT_LABEL[d.status]}</button>`;
    }
    if(d.status !== 'pending'){
      actions += `<button class="act b-reset" onclick="resetStatus(${d.id})">Reset</button>`;
    }
    return `<div class="card">
      <div class="row1">
        <div>
          <div class="village">${esc(d.village)}</div>
          <div class="mandal">${esc(d.mandal)} · Bus ${d.busNo?esc(d.busNo):'—'}</div>
        </div>
        <span class="pill ${d.status}">${STATUS_LABEL[d.status]}</span>
      </div>
      <div class="meta">
        <div><b>Start point:</b> ${esc(d.start)||'—'}</div>
        <div><b>Boarding incharge:</b> ${esc(d.inch)||'—'} ${d.inchNum?('· '+esc(d.inchNum)):''}</div>
        <div><b>Bus incharge:</b> ${esc(d.busInch)||'—'} ${d.busInchNum?('· '+esc(d.busInchNum)):''}</div>
        <div><b>Driver:</b> ${esc(d.driver)||'—'} ${d.driverNum?('· '+esc(d.driverNum)):''} · <b>Persons:</b> ${d.persons}</div>
        ${tsLine?`<div class="ts">${tsLine}</div>`:''}
      </div>
      <div class="actions">${actions}</div>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function advance(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  const next = NEXT[d.status];
  if(!next) return;
  d.status = next;
  d.ts = d.ts || {};
  d.ts[next] = new Date().toISOString();
  renderAll();
  persist();
}

function resetStatus(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  d.status = 'pending';
  d.ts = {};
  renderAll();
  persist();
}

function renderAll(){
  populateMandalFilter();
  renderSummary();
  renderList();
}

function buildDocument(){
  const dataScript = JSON.stringify(DATA);
  let doc = document.documentElement.outerHTML;
  doc = doc.replace(/(<script id="bus-data" type="application\/json">)[\s\S]*?(<\/script>)/, '$1'+dataScript+'$2');
  return '<!DOCTYPE html>\n' + doc;
}

let saveTimer = null;
function persist(){
  if(!artifactApi) return;
  clearTimeout(saveTimer);
  const bar = document.getElementById('savebar');
  bar.classList.add('show');
  saveTimer = setTimeout(async ()=>{
    try{ await artifactApi.publish(buildDocument()); }catch(e){}
    setTimeout(()=>bar.classList.remove('show'), 600);
  }, 500);
}

document.getElementById('mandalFilter').addEventListener('change', renderList);
document.getElementById('statusFilter').addEventListener('change', renderList);
document.getElementById('search').addEventListener('input', renderList);

renderAll();

(async ()=>{
  try{
    if(window.claude && window.claude.use){
      artifactApi = await window.claude.use('artifact');
    }
  }catch(e){}
})();
</script>
</body>
</html>
